# Claim regex patterns for industrial asset parameters
torque:
  pattern: '(?i)(?:torque[a-z\s]*|tighten[a-z\s]*to\s+)?(\d+(?:\.\d+)?)\s*(?:Nm|N-m|ft-lbs?|ft\s*lbs?)'
  unit: 'Nm'
  property: 'torque'

pressure:
  pattern: '(?i)(?:pressure[a-z\s]*|head[a-z\s]*)?(\d+(?:\.\d+)?)\s*(?:bar|psi|kPa|MPa)'
  unit: 'bar'
  property: 'pressure'

temperature:
  pattern: '(?i)(?:temp(?:erature)?[a-z\s]*)?(\d+(?:\.\d+)?)\s*(?:°C|C|°F|F)\b'
  unit: 'C'
  property: 'temperature'

clearance:
  pattern: '(?i)(?:clearance|runout|tolerance|gap|shim[s]?)[a-z\s]*(\d+(?:\.\d+)?)\s*(?:mm|in|thou|µm)'
  unit: 'mm'
  property: 'clearance'

speed_rpm:
  pattern: '(?i)(\d{1,3}(?:,\d{3})*|\d+)\s*(?:rpm|RPM)'
  unit: 'RPM'
  property: 'speed'
