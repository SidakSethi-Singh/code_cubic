version: "3.9"
services:
  qdrant-server:
    image: qdrant/qdrant:v1.12.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    ports:
      - "8765:8765"
    environment:
      - HUB_DB=/app/data/hub.db
    volumes:
      - hub_data:/app/data
    depends_on:
      - qdrant-server

volumes:
  qdrant_data:
  hub_data:
